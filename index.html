<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>复旦自然生态科考社 · 自然观察挑战</title>
<style>
:root{--bg:#f5f7f2;--card:#fff;--text:#243127;--muted:#6f7b71;--accent:#3f6b4b;--accent2:#e9f0e7;--wrong:#a34b45;--line:#dde5dc}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
.wrap{max-width:680px;margin:auto;padding:20px 16px 36px}.hero{padding:22px 4px 14px}.eyebrow{font-size:12px;color:var(--accent);font-weight:700;letter-spacing:.06em}.hero h1{margin:7px 0 8px;font-size:28px}.hero p{margin:0;color:var(--muted);line-height:1.6}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;margin:14px 0;box-shadow:0 4px 18px rgba(30,50,35,.04)}
.progress{display:flex;justify-content:space-between;color:var(--muted);font-size:14px;margin-bottom:12px}.bar{height:6px;background:#e7ece6;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent)}
.qtitle{font-size:18px;font-weight:700;line-height:1.55;margin:16px 0}.opt{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:13px;padding:13px 14px;margin:9px 0;font-size:16px;line-height:1.45;color:var(--text)}
.opt.selected{border:2px solid var(--accent);background:var(--accent2);padding:12px 13px}.primary,.secondary{width:100%;border-radius:13px;padding:14px 16px;font-size:16px;font-weight:700;cursor:pointer;margin-top:8px}.primary{border:0;background:var(--accent);color:#fff}.secondary{border:1px solid var(--accent);background:#fff;color:var(--accent)}
.score{font-size:52px;font-weight:800;color:var(--accent);text-align:center}.result{text-align:center}.review{text-align:left;margin-top:12px}.item{border-top:1px solid var(--line);padding:15px 0}.ok{color:#39704a;font-weight:700}.bad{color:var(--wrong);font-weight:700}.tag{display:inline-block;padding:4px 8px;background:#eef3ec;color:var(--accent);border-radius:999px;font-size:12px;margin-bottom:8px}.exp{color:var(--muted);line-height:1.55;margin-top:6px}.small{color:var(--muted);font-size:14px}.footer{text-align:center;color:#8a948b;font-size:12px;margin-top:20px}
.qimg{max-width:100%;border-radius:12px;margin:12px 0;display:block;}
.opt img{max-height:100px;max-width:100%;display:block;margin-top:6px;border-radius:8px;}
</style></head><body><div class="wrap">
<section class="hero"><div class="eyebrow">Fudan Ecological Exploration Society</div>
<h1>自然观察挑战</h1><p>昆虫 · 兽类 · 鸟类 · 两爬 · 植物 · 生态系统</p></section>
<main id="app"></main><div class="footer">复旦自然生态科考社 · 百团招新</div></div>
<script>
let bank=[],current=[],answers=[],index=0;const letters=["A","B","C","D"];
async function load(){bank=await fetch("questions.json").then(r=>r.json());start()}
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function start(){
 const cats=[...new Set(bank.map(x=>x.category))];
 // 每个类别至少抽1题，再补足到9题
 let selected = [];
 cats.forEach(c => {
   const pool = bank.filter(x => x.category === c);
   if (pool.length > 0) selected.push(shuffle(pool)[0]);
 });
 if (selected.length < 9) {
   const selectedIds = new Set(selected.map(q => q.id));
   const remaining = bank.filter(q => !selectedIds.has(q.id));
   const need = 9 - selected.length;
   selected = selected.concat(shuffle(remaining).slice(0, need));
 }
 current = shuffle(selected).slice(0, 9);
 answers=Array(9).fill(null);index=0;renderQuestion()
}
function renderQuestion(){
  const q=current[index],app=document.getElementById("app");
  let qImageHtml = q.image ? '<img class="qimg" src="'+q.image+'" alt="题目图片">' : '';
  app.innerHTML='<div class="card"><div class="progress"><span>第 '+(index+1)+' / 9 题</span><span>'+esc(q.category)+'</span></div><div class="bar"><i style="display:block;height:100%;width:'+((index+1)/9*100)+'%;background:var(--accent)"></i></div><div class="qtitle">'+esc(q.question)+'</div>'+ qImageHtml +
  q.options.map((o,i)=>{
    let content = '';
    if (typeof o === 'string') {
      content = esc(o);
    } else if (o && typeof o === 'object') {
      content = esc(o.text || '') + (o.image ? '<img src="'+o.image+'" alt="选项图片">' : '');
    }
    return '<button class="opt '+(answers[index]===i?'selected':'')+'" onclick="choose('+i+')"><b class="letter">'+letters[i]+'</b>'+content+'</button>';
  }).join("")+
  '<button class="primary" onclick="next()">'+(index===8?'提交答案':'下一题')+'</button></div>'
}
function choose(i){answers[index]=i;renderQuestion()}
function next(){if(answers[index]===null){alert("先选一个答案吧！");return}if(index<8){index++;renderQuestion()}else{renderResult()}}
function getOptionDisplay(q, idx){
  if(idx === null || idx === undefined) return '未选';
  const opt = q.options[idx];
  let text = '';
  if (typeof opt === 'string') text = opt;
  else if (opt && typeof opt === 'object') text = opt.text || '图片选项';
  return letters[idx] + '. ' + text;
}
function renderResult(){
  let score=current.reduce((s,q,i)=>s+(answers[i]===q.answer?1:0),0);
  let prizeMsg = score >= 5 ? '<div style="color:#3f6b4b;font-weight:700;margin-top:8px;">🎉 恭喜！答对5题及以上，可以盖章拿奖品！</div>' : '';
  document.getElementById("app").innerHTML=
  '<div class="card result"><div class="small">本次成绩</div><div class="score">'+score+' / 9</div><div>'+ (score===9?'太厉害了！全对！':score>=5?'不错！继续观察自然，你会有更多发现':'继续观察自然，你会发现更多有趣的细节')+'</div>'+ prizeMsg +'<div class="review">'+
  current.map((q,i)=>'<div class="item"><span class="tag">'+esc(q.category)+'</span><div><b>'+(i+1)+'. '+esc(q.question)+'</b></div><div class="'+(answers[i]===q.answer?'ok':'bad')+'">'+(answers[i]===q.answer?'✓ 答对了':'✕ 答错了')+'　你的答案：'+getOptionDisplay(q, answers[i])+'　正确答案：'+getOptionDisplay(q, q.answer)+'</div>'+(q.explanation?'<div class="exp">'+esc(q.explanation)+'</div>':'')+'</div>').join("")+
  '</div><button class="primary" onclick="start()">再来一组</button></div>'
}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
load();
</script></body></html>
